name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy-admin:
    name: Deploy Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy Admin
        env:
          VERCEL_ORG_ID: uOnAs2UKqy7k0HR9liIAypEJ
          VERCEL_PROJECT_ID: prj_GB0rSjvNcPtvOhBXDaOLaOCSyEVO
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes

  deploy-seller:
    name: Deploy Seller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy Seller
        env:
          VERCEL_ORG_ID: uOnAs2UKqy7k0HR9liIAypEJ
          VERCEL_PROJECT_ID: prj_CcJoWnSQc80Y624vfF8VLu8l4lOt
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy Web
        env:
          VERCEL_ORG_ID: uOnAs2UKqy7k0HR9liIAypEJ
          VERCEL_PROJECT_ID: prj_WGNtDrXA8CnUvm4RAggzabM9X8pa
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
