# render.yaml — Conneqt Infrastructure as Code
# Docs: https://render.com/docs/blueprint-spec
#
# Este arquivo configura todos os serviços do Conneqt no Render.
# Para usar: conecte o repositório no Render e clique em "Apply Blueprint".
#
# IMPORTANTE: Após o primeiro deploy, copie as URLs geradas e preencha
# as variáveis FRONTEND_URL, SELLER_URL e ADMIN_URL na API,
# e NEXT_PUBLIC_API_URL + NEXT_PUBLIC_WS_URL nos apps Next.js.

services:
  # ── 1. API NestJS ─────────────────────────────────────────────────────────
  - type: web
    name: conneqt-api
    runtime: node
    nodeVersion: 20.19.1
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      npm install -g pnpm@9 &&
      pnpm install --filter @conneqtcar/api... --filter @conneqtcar/database --no-frozen-lockfile --ignore-scripts
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # API_PORT não é necessário — Render injeta PORT automaticamente
      # DATABASE (Supabase)
      - key: DATABASE_URL
        sync: false   # preencher no dashboard
      - key: DIRECT_URL
        sync: false   # preencher no dashboard
      # SUPABASE STORAGE
      - key: SUPABASE_URL
        sync: false   # ex: https://qwljecbnacxyogfshrrq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # service_role key do projeto Supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: banners
      # REDIS (provisionado abaixo como conneqt-redis)
      - key: REDIS_URL
        fromService:
          name: conneqt-redis
          type: redis
          property: connectionString
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # URLs dos frontends (preencher após deploy dos apps na Vercel)
      - key: FRONTEND_URL
        sync: false   # ex: https://conneqt.vercel.app
      - key: SELLER_URL
        sync: false   # ex: https://conneqt-seller.vercel.app
      - key: ADMIN_URL
        sync: false   # ex: https://conneqt-admin.vercel.app
      # FIPE (público, não precisa de chave)
      - key: FIPE_API_URL
        value: https://parallelum.com.br/fipe/api/v2
      # AWS S3 (opcional para testes — deixe vazio para pular uploads)
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_CLOUDFRONT_URL
        sync: false

  # ── 2. Keepalive Cron ─────────────────────────────────────────────────────
  # Pinga a API a cada 14 min para evitar cold start no plano free do Render.
  - type: cron
    name: conneqt-api-keepalive
    runtime: node
    region: oregon
    schedule: "*/14 * * * *"
    buildCommand: echo "keepalive"
    startCommand: >-
      node -e "
      require('https').get('https://conneqt-api.onrender.com/api/v1/health', (r) => {
        console.log('keepalive ok', r.statusCode, new Date().toISOString());
        process.exit(0);
      }).on('error', (e) => { console.error(e.message); process.exit(1); });
      "

  # ── 3. Redis ──────────────────────────────────────────────────────────────
  - type: redis
    name: conneqt-redis
    region: oregon
    plan: free       # 25MB, suficiente para cache e sessões em testes
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # permite acesso apenas de serviços internos do Render
